<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PETRO</title>
<meta name="theme-color" content="#1F6B63">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/CelePetrone/petro-app/main/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de una columna, barra de arriba con el mes, pestañas abajo en el celu y arriba en la compu */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#18302E; --muted:#5B6F6C; --line:#D9E2E0;
  --accent:#1F6B63; --accent-ink:#FFFFFF; --accent-soft:#D6EAE6; --accent-2:#C98A2B;
  --ok:#2E8B57; --ok-soft:#DDF0E4; --warn:#9A7212; --warn-soft:#FBF0D3; --bad:#B8443A; --bad-soft:#F6DEDA; --none:#8A9996; --none-soft:#ECEFEE;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A19; --surface:#152422; --ink:#E4EEEC; --muted:#93A8A4; --line:#26403C;
  --accent:#5FC2B4; --accent-ink:#0F1A19; --accent-soft:#1D3A36; --accent-2:#E2AE5A;
  --ok:#5CC98A; --ok-soft:#173326; --warn:#E3B54C; --warn-soft:#3A2F14; --bad:#EE7B6F; --bad-soft:#3D1F1C; --none:#6F8480; --none-soft:#1B2B29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A19; --surface:#152422; --ink:#E4EEEC; --muted:#93A8A4; --line:#26403C;
  --accent:#5FC2B4; --accent-ink:#0F1A19; --accent-soft:#1D3A36; --accent-2:#E2AE5A;
  --ok:#5CC98A; --ok-soft:#173326; --warn:#E3B54C; --warn-soft:#3A2F14; --bad:#EE7B6F; --bad-soft:#3D1F1C; --none:#6F8480; --none-soft:#1B2B29; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:1.15rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barra superior */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:960px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.02em;margin-right:auto}
.brand small{display:block;font:500 .72rem var(--f-body);color:var(--muted);letter-spacing:0}
select,input[type=text],input[type=number],input[type=url],input[type=password]{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);min-width:0}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;line-height:1}

/* pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
@media (min-width:760px){
  body{padding-bottom:24px}
  nav.tabs{position:static;max-width:960px;margin:0 auto;background:transparent;border:0;display:flex;gap:6px;padding:12px 16px 0}
  nav.tabs a{flex-direction:row;gap:8px;font-size:.88rem;padding:8px 14px;border-radius:8px}
  nav.tabs a[aria-current="page"]{background:var(--accent-soft)}
}
main{max-width:960px;margin:0 auto;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
section{display:grid;gap:12px;align-content:start;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between}
.sec-head p{margin:0;color:var(--muted);font-size:.85rem;max-width:60ch}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px;align-content:start}
.tile .v{font-family:var(--f-num);font-size:1.2rem;font-weight:500;font-variant-numeric:tabular-nums}
.tile .s{font-size:.78rem;color:var(--muted)}
.tile.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.hero .eyebrow,.tile.hero .s{color:var(--accent-ink);opacity:.85}
.neg{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}

.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.s1{background:var(--ok-soft);color:var(--ok)}
.pill.s2{background:var(--warn-soft);color:var(--warn)}
.pill.s3{background:var(--bad-soft);color:var(--bad)}
.pill.s0,.pill.s4{background:var(--none-soft);color:var(--none)}

/* listas de conceptos */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rows h3{font:600 .72rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 14px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.row{width:100%;display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px 11px 0}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row .bar{grid-row:1/3;align-self:stretch;border-radius:0 3px 3px 0;background:var(--none-soft)}
.row.s1 .bar{background:var(--ok)} .row.s2 .bar{background:var(--warn)} .row.s3 .bar{background:var(--bad)}
.row .c{font-weight:500}
.row .d{grid-column:2;font-size:.8rem;color:var(--muted)}
.row .m{grid-row:1/3;grid-column:3;text-align:right;display:grid;gap:3px;justify-items:end}
.row .m .num{font-size:.95rem}
.empty{padding:16px;color:var(--muted)}

/* barras horizontales */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:.86rem}
.bar-row .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.bar-row .fill{height:100%;background:var(--accent);border-radius:4px}
.bar-row.alt .fill{background:var(--accent-2)}
.bar-row .pct{color:var(--muted);font-size:.78rem}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
td.num{font-family:var(--f-num)}
.chart{position:relative;height:280px}
.chart.sm{height:220px}

/* repartos */
.calc{display:grid;gap:0}
.calc .num{white-space:nowrap}
.calc div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.calc div:last-child{border-bottom:0;font-weight:600}
.form{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:.82rem;font-weight:600}
.field small{color:var(--muted);font-size:.78rem}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline>input{flex:1 1 140px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.link{border:0;background:none;padding:6px 4px;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

/* modal */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(10,20,19,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-height:92vh;overflow:auto}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
.sheet header{display:flex;justify-content:space-between;gap:12px;align-items:start}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap}
.sheet .actions .primary{flex:1 1 auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
.loading{opacity:.55;pointer-events:none}
.setup{max-width:520px;margin:8vh auto 0}
.setup ol{padding-left:20px;margin:0;display:grid;gap:6px;font-size:.9rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="top" id="top" hidden>
  <div class="top-in">
    <div class="brand">PETRO<small id="sync">—</small></div>
    <select id="mes" aria-label="Mes"></select>
    <button class="icon-btn" id="recargar" title="Traer lo último del Sheet" aria-label="Recargar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>
</div>
<nav class="tabs" id="tabs" hidden>
  <a href="#mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mes</a>
  <a href="#anotar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg>Anotar</a>
  <a href="#repartos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l7 5"/></svg>Repartos</a>
  <a href="#tablero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Tablero</a>
</nav>
<main id="app"></main>
<div id="modal"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){
'use strict';
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES_C = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const EST = {0:'No corresponde',1:'Anotado',2:'Toca este mes',3:'Atrasado',4:'Más adelante'};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const isNum = v => typeof v==='number' && isFinite(v);
const fmt = n => (n<0?'−':'')+'$ '+Math.round(Math.abs(n)).toLocaleString('es-AR');
const fmtK = n => { const a=Math.abs(n); return (n<0?'−':'')+'$ '+(a>=1e6?(a/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M':Math.round(a/1e3)+' mil'); };
const usd = n => 'USD '+Math.round(n).toLocaleString('es-AR');
const sum = a => a.reduce((x,y)=>x+(isNum(y)?y:0),0);
const store = {
  get(k,d){ try{const v=localStorage.getItem('petro-'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem('petro-'+k,JSON.stringify(v));}catch(e){} }
};
// "1.234.567" / "1234567,5" / "1234567" → número
function parseMonto(s){
  s=String(s).trim().replace(/\$|\s/g,'');
  if(!s) return null;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(',','.');
  const n=Number(s); return isFinite(n)?n:NaN;
}

let raw = null, M = null, mesSel = null, ocupado = false;
let tc = store.get('tc',1450);
let charts = [];

// ---------- conexión: la app corre dentro de Google (Apps Script) ----------
function api(cuerpo){
  return new Promise((ok,mal)=>{
    if(!(window.google&&google.script&&google.script.run)) return mal(new Error('Esta página se abre desde el link de Google de la app.'));
    google.script.run
      .withSuccessHandler(j=>{ if(j&&j.ok) ok(j); else mal(new Error(j&&j.error||'Algo salió mal.')); })
      .withFailureHandler(e=>mal(new Error((e&&e.message)||'No se pudo hablar con el Sheet.')))
      .api(cuerpo);
  });
}
async function cargar(){
  setBusy(true);
  try{ const j = await api({accion:'leer'}); usar(j.datos,j.quien); }
  catch(e){ toast(e.message,true); if(!raw) pintarError(e.message); }
  finally{ setBusy(false); }
}
async function anotar(items, okMsg){
  setBusy(true);
  try{ const j = await api({accion:'anotar',items}); usar(j.datos,j.quien); toast(okMsg||'Anotado en el Sheet'); return true; }
  catch(e){ toast(e.message,true); return false; }
  finally{ setBusy(false); }
}
function setBusy(b){ ocupado=b; $('app').classList.toggle('loading',b); $('recargar').disabled=b; }

// ---------- lectura del Sheet ----------
function parsear(d){
  const C = d.control, filas = [];
  let seccion='';
  for(let i=4;i<C.length;i++){
    const r=C[i]; const concepto=String(r[1]||'').trim(); if(!concepto) continue;
    if(/^(Total|GANANCIA|Le toca|Cosas pendientes|Quedó)/.test(concepto)) continue;
    if(!String(r[3]||'').trim() && concepto.split(' · ')[0]===concepto.split(' · ')[0].toUpperCase()){ seccion=concepto.toUpperCase(); continue; }
    const valores=r.slice(5,17).map(v=>v===''?null:v);
    const estados=r.slice(21,33).map(v=>isNum(v)?v:0);
    let tipo='otro', grupo='';
    if(seccion.startsWith('INGRESOS')) tipo='ingreso';
    else if(seccion.startsWith('FUERA')) tipo='fuera';
    else if(seccion.startsWith('GASTOS')){ tipo='gasto'; grupo=grupoGasto(seccion,concepto); }
    else if(seccion.startsWith('REPARTOS')) tipo=/^Apartado/.test(concepto)?'fondo':'reparto';
    else if(seccion.startsWith('DEPÓSITOS')) tipo='deposito';
    filas.push({fila:i+1,concepto,detalle:String(r[2]||''),frec:String(r[3]||''),seccion,tipo,grupo,valores,estados,
      rank:isNum(r[33])?r[33]:null, pendMeses:String(r[34]||''), pendEstado:String(r[35]||'')});
  }
  const secciones=[]; filas.forEach(f=>{ if(!secciones.includes(f.seccion)) secciones.push(f.seccion); });
  const de = t => filas.filter(f=>f.tipo===t);
  const ingresos=de('ingreso'), gastos=de('gasto');
  const col=(rows,m)=>sum(rows.map(r=>isNum(r.valores[m])?r.valores[m]:0));
  const cobrado=[...Array(12)].map((_,m)=>col(ingresos,m));
  const pagado=[...Array(12)].map((_,m)=>col(gastos,m));
  const reparto={}; de('reparto').forEach(f=>{ reparto[f.concepto.replace('Reparto ','')]=f; });
  const fondo=filas.find(f=>f.tipo==='fondo');
  // unidades
  const U=d.unidades||[], unidades=[];
  for(let i=3;i<U.length;i++){ const r=U[i]; if(r[3]!=='Sí'||!r[8]) continue;
    unidades.push({unidad:r[1],quien:r[2],alquiler:r[4],indice:`${r[6]} cada ${r[7]} meses`,proximo:new Date(r[8])}); }
  // AySA
  const A=d.aysa||[];
  const aysaReserva = A[7]&&isNum(A[7][12])?A[7][12]:null;
  const aysaMica = A[15]&&isNum(A[15][12])?A[15][12]:null;
  let cobLocal=Array(12).fill(null);
  for(let i=28;i<A.length;i++){ if(A[i][1]==='Mes'&&A[i][3]==='Local: AySA'){ for(let m=0;m<12;m++){ const v=(A[i+1+m]||[])[3]; cobLocal[m]=isNum(v)?v:null; } break; } }
  const F=d.fondo||[];
  const fondoMensual = F[4]&&isNum(F[4][4])?F[4][4]:null;
  const mesReunion = isNum(C[1][5])?C[1][5]:(new Date().getMonth()+1);
  return {filas,secciones,ingresos,gastos,cobrado,pagado,reparto,fondo,unidades,aysaReserva,aysaMica,cobLocal,fondoMensual,mesReunion,
    anio:isNum(C[1][2])?C[1][2]:new Date().getFullYear(), leido:d.leido, demo:!!d.demo};
}
function grupoGasto(sec,c){
  c=c.toLowerCase();
  if(c.startsWith('aysa')) return 'AySA';
  if(c.startsWith('abl')) return 'ABL / TSG';
  if(c.startsWith('arba')) return 'ARBA';
  if(c.includes('tarjeta')) return 'Tarjeta';
  if(c.includes('arreglo')) return 'Arreglos';
  if(sec.includes('SAN MART')) return 'San Martín';
  if(sec.includes('IMPUESTO')) return 'Monotributo e IIBB';
  return 'Otros';
}
let quien=store.get('quien','');
function usar(d,q){
  if(q){ quien=q; store.set('quien',q); }
  raw=d; M=parsear(d);
  if(mesSel===null){ const g=store.get('mes',null); mesSel = g&&g>=1&&g<=12 ? g : M.mesReunion; }
  pintarMeses(); $('top').hidden=false; $('tabs').hidden=false;
  const t=new Date(d.leido); $('sync').textContent=(M.demo?'Datos de prueba · ':'')+(quien?quien.split('@')[0]+' · ':'')+'Actualizado '+t.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  render();
}
function pintarMeses(){
  const s=$('mes'); s.innerHTML=MESES.map((m,i)=>`<option value="${i+1}">${cap(m)} ${M.anio}</option>`).join(''); s.value=mesSel;
}

// ---------- vistas ----------
function vista(){ const h=location.hash.slice(1); return ['mes','anotar','repartos','tablero'].includes(h)?h:'mes'; }
function render(){
  if(!M) return;
  const v=vista();
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+v?'page':'false'));
  charts.forEach(c=>c.destroy()); charts=[];
  ({mes:vMes,anotar:vAnotar,repartos:vRepartos,tablero:vTablero})[v]();
}
function tile(label,val,sub,cls){
  return `<div class="tile ${cls||''}"><div class="eyebrow">${esc(label)}</div><div class="v ${val<0&&cls!=='hero'?'neg':''}">${val==null?'—':fmt(val)}</div>${sub?`<div class="s">${sub}</div>`:''}</div>`;
}
function numeros(m){
  const i=m-1, rep=M.reparto, c=M.cobrado[i], p=M.pagado[i], g=c-p;
  const porUna = rep.Cele&&isNum(rep.Cele.valores[i])?rep.Cele.valores[i]:0;
  const totalRep = sum(Object.values(rep).map(f=>f.valores[i]));
  const fondo = M.fondo&&isNum(M.fondo.valores[i])?M.fondo.valores[i]:0;
  return {c,p,g,porUna,totalRep,fondo,quedo:g-totalRep-fondo};
}
function valorTxt(v){ return v==null?'':(isNum(v)?fmt(v):String(v)); }
function filaHTML(f,m){
  const i=m-1, v=f.valores[i];
  let st=f.estados[i];
  if(st===2 && f.estados.slice(0,i).includes(3)) st=3;
  const chip = st===1 ? (isNum(v)?`<span class="num">${fmt(v)}</span>`:`<span class="pill s1">${esc(v)}</span>`) : `<span class="pill s${st}">${EST[st]}</span>`;
  return `<button class="row s${st}" data-fila="${f.fila}" data-mes="${m}"><span class="bar"></span><span class="c">${esc(f.concepto)}</span><span class="m">${chip}</span><span class="d">${esc(f.detalle)}${f.rank!=null&&f.pendMeses?' · falta: '+esc(f.pendMeses):''}</span></button>`;
}
function conectarFilas(root){
  root.querySelectorAll('.row[data-fila]').forEach(b=>b.addEventListener('click',()=>abrirAnotar(+b.dataset.fila,+b.dataset.mes)));
}

function vMes(){
  const m=mesSel, n=numeros(m), prev=m>1?numeros(m-1):null;
  const delta = prev&&prev.g ? (n.g-prev.g)/prev.g : null;
  // pendientes: lo que toca este mes y lo atrasado
  const pend = M.filas.filter(f=>(f.tipo==='ingreso'||f.tipo==='gasto') && (f.estados[m-1]===2 || f.estados.slice(0,m).includes(3)));
  pend.sort((a,b)=>(b.estados.slice(0,m).includes(3)?1:0)-(a.estados.slice(0,m).includes(3)?1:0));
  $('app').innerHTML = `
  <section><div class="sec-head"><h2>${cap(MESES[m-1])}</h2><p>Lo que entró a la cuenta del negocio, lo que se pagó y lo que quedó.</p></div>
    <div class="tiles">
      ${tile('Cobrado',n.c,'Local, Javier, depto 5 y San Martín')}
      ${tile('Pagado',n.p,'Gastos e impuestos')}
      ${tile('Ganancia',n.g, delta==null?'':`${delta>=0?'+':'−'}${Math.abs(delta*100).toLocaleString('es-AR',{maximumFractionDigits:1})}% contra ${MESES[m-2]}`,'hero')}
      ${tile('Repartido a cada una',n.porUna,`Le toca ${fmt(n.g/3)}`)}
      ${tile('Quedó en la cuenta',n.totalRep||n.fondo?n.quedo:null, n.totalRep||n.fondo?'Ganancia − repartido − fondo':'Todavía no hay repartos anotados')}
    </div></section>
  <section><div class="sec-head"><h2>Qué falta pagar o cobrar</h2><p>Tocá un concepto para anotarlo. Si está anotado, está pagado (o cobrado).</p></div>
    <div class="rows" id="pend">${pend.length?pend.map(f=>{ const atr=f.estados.slice(0,m).indexOf(3); return filaHTML(f, atr>=0 && f.estados[m-1]!==2 ? atr+1 : m); }).join(''):'<div class="empty">No falta nada en '+MESES[m-1]+'. Todo anotado.</div>'}</div></section>
  <section><div class="sec-head"><h2>Próximos ajustes de alquiler</h2></div><div class="rows">${ajustesHTML()}</div></section>`;
  conectarFilas($('pend'));
}
function ajustesHTML(){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  return M.unidades.map(u=>{ const dias=Math.round((u.proximo-hoy)/864e5);
    const st=dias<0?3:(dias<=30?2:1); const txt=dias<0?'Vencido':(dias===0?'Hoy':`En ${dias} días`);
    return `<div class="row s${st}" style="cursor:default"><span class="bar"></span><span class="c">${esc(u.unidad)} · ${esc(u.quien)}</span><span class="m"><span class="pill s${st===1?4:st}">${txt}</span></span><span class="d">${isNum(u.alquiler)?fmt(u.alquiler):''} · ${esc(u.indice)} · ${MESES[u.proximo.getMonth()]} ${u.proximo.getFullYear()}</span></div>`;}).join('') || '<div class="empty">Sin datos de unidades.</div>';
}

function vAnotar(){
  const m=mesSel;
  const grupos = M.secciones.filter(s=>!s.startsWith('REPARTOS')).map(s=>{
    const fs=M.filas.filter(f=>f.seccion===s); if(!fs.length) return '';
    const titulo=s.split(' · ')[0]==='GASTOS'?'Gastos · '+cap(s.split(' · ')[1].toLowerCase()):cap(s.split(' · ')[0].toLowerCase());
    return `<div class="rows"><h3>${esc(titulo)}</h3>${fs.map(f=>filaHTML(f,m)).join('')}</div>`;
  }).join('');
  $('app').innerHTML = `<section><div class="sec-head"><h2>Anotar en ${MESES[m-1]}</h2><p>Verde: anotado. Amarillo: toca este mes. Rojo: atrasado. Gris: no corresponde. Tocá una fila para cargar o corregir.</p></div>${grupos}</section>`;
  conectarFilas($('app'));
}

function vRepartos(){
  const m=mesSel, i=m-1, n=numeros(m);
  const aysaRow=M.gastos.find(f=>f.grupo==='AySA');
  const aysaPend = aysaRow && aysaRow.estados[i]!==1 ? (M.aysaReserva||0) : 0;
  const usdMeta = store.get('usdMeta',100);
  const fondoPesos = Math.round(usdMeta*tc);
  const libre = Math.max(0,n.g-aysaPend-fondoPesos);
  const sug = Math.floor(libre/3/10000)*10000;
  const rep=M.reparto;
  const hermanas=['Mica','Anto','Cele'].filter(h=>rep[h]);
  $('app').innerHTML = `
  <section><div class="sec-head"><h2>Cuánto repartir en ${MESES[m-1]}</h2><p>El sugerido se redondea para abajo a $10.000. Pueden repartir menos: lo que queda, queda en la cuenta.</p></div>
    <div class="two">
      <div class="panel calc">
        <div><span>Ganancia del mes</span><span class="num">${fmt(n.g)}</span></div>
        <div><span>Dejar para AySA ${aysaPend?'<small class="muted">(factura estimada)</small>':'<small class="muted">(ya está pagada)</small>'}</span><span class="num">− ${fmt(aysaPend)}</span></div>
        <div><span>Apartar para el fondo <small class="muted">(${usd(usdMeta)})</small></span><span class="num">− ${fmt(fondoPesos)}</span></div>
        <div><span>Se puede repartir</span><span class="num">${fmt(libre)}</span></div>
      </div>
      <div class="tiles">
        ${tile('Sugerido para cada una',sug,'','hero')}
        ${tile('Ya repartido a cada una',n.porUna,n.porUna?'':'Nada anotado todavía')}
      </div>
    </div></section>
  <section><div class="sec-head"><h2>Anotar el reparto</h2><p>Si es la segunda repartija del mes, usá "Sumar": se agrega a lo que ya está anotado.</p></div>
    <form class="panel form" id="f-rep">
      <div class="field"><label for="rep-monto">A cada una</label>
        <div class="inline"><input id="rep-monto" type="text" inputmode="decimal" placeholder="${sug?sug.toLocaleString('es-AR'):'0'}" autocomplete="off">
        <button type="button" class="btn link" id="rep-sug">Usar sugerido</button></div>
        <small>Mismo monto para ${hermanas.join(', ')}. Hoy: ${hermanas.map(h=>h+' '+(valorTxt(rep[h].valores[i])||'—')).join(' · ')}</small></div>
      <div class="actions inline"><button class="btn primary" type="submit" data-modo="poner">Anotar</button><button class="btn" type="submit" data-modo="sumar">Sumar a lo anotado</button></div>
    </form></section>
  <section><div class="sec-head"><h2>Fondo de ahorro</h2><p>La meta es dejar entre USD 100 y 200 por mes.</p></div>
    <div class="panel form" id="f-fondo">
      <div class="two">
        <div class="field"><label for="tc">Dólar al que compran ($ por USD)</label><input id="tc" type="number" min="1" step="5" value="${tc}"></div>
        <div class="field"><span class="eyebrow" style="padding-top:4px">Meta del mes</span><div class="chips" id="usd-chips">${[100,150,200].map(u=>`<button type="button" class="chip" aria-pressed="${u===usdMeta}" data-u="${u}">${usd(u)}</button>`).join('')}</div></div>
      </div>
      <div class="tiles">
        ${tile('Apartado en '+MESES[m-1], n.fondo, n.fondo?usd(n.fondo/tc)+(n.fondo/tc>=100?' · dentro de la meta':' · debajo de la meta'):'Nada apartado todavía')}
        ${tile('Ahorrado en el año', M.fondo?sum(M.fondo.valores):0, usd((M.fondo?sum(M.fondo.valores):0)/tc)+' al dólar de hoy')}
      </div>
      <div class="field"><label for="fondo-monto">Apartar en ${MESES[m-1]} (pesos)</label>
        <div class="inline"><input id="fondo-monto" type="text" inputmode="decimal" placeholder="${fondoPesos.toLocaleString('es-AR')}" autocomplete="off"><button type="button" class="btn primary" id="fondo-ok">Anotar fondo</button></div></div>
    </div></section>`;
  $('rep-sug').onclick=()=>{ $('rep-monto').value=sug.toLocaleString('es-AR'); };
  let modo='poner';
  $('f-rep').querySelectorAll('button[type=submit]').forEach(b=>b.onclick=()=>{modo=b.dataset.modo;});
  $('f-rep').onsubmit=async e=>{ e.preventDefault(); if(ocupado) return;
    const v=parseMonto($('rep-monto').value); if(!v||v<0){ toast('Escribí un monto válido.',true); return; }
    const items=hermanas.map(h=>{ const f=rep[h], act=f.valores[i];
      return {fila:f.fila,mes:m,concepto:f.concepto,valor: modo==='sumar'&&isNum(act) ? `=${act}+${v}` : v}; });
    await anotar(items, `Reparto de ${fmt(v)} anotado para las tres`);
  };
  $('tc').oninput=e=>{ const v=+e.target.value; if(v>0){ tc=v; store.set('tc',tc); } };
  $('tc').onchange=()=>render();
  $('usd-chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ store.set('usdMeta',+c.dataset.u); render(); });
  $('fondo-ok').onclick=async()=>{ if(ocupado||!M.fondo) return;
    const v=parseMonto($('fondo-monto').value||fondoPesos); if(v==null||isNaN(v)||v<0){ toast('Escribí un monto válido.',true); return; }
    await anotar([{fila:M.fondo.fila,mes:m,concepto:M.fondo.concepto,valor:v}], `${fmt(v)} apartados al fondo`);
  };
}

function vTablero(){
  const m=mesSel, i=m-1;
  const conDatos=M.cobrado.map((v,k)=>v>0?k:-1).filter(k=>k>=0);
  const ing=M.ingresos.map(f=>({k:f.concepto,v:isNum(f.valores[i])?f.valores[i]:0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const g={}; M.gastos.forEach(f=>{ if(isNum(f.valores[i])) g[f.grupo]=(g[f.grupo]||0)+f.valores[i]; });
  const gas=Object.entries(g).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const aysa=M.gastos.find(f=>f.grupo==='AySA');
  const aI=aysa?aysa.valores.map((v,k)=>isNum(v)?k:-1).filter(k=>k>=0):[];
  let filas=''; let dif=0;
  aI.forEach(k=>{ const toca=aysa.valores[k]*0.425, cob=M.cobLocal[k];
    if(cob==null){ filas+=`<tr><td>${MES_C[k]}</td><td class="num">${fmt(toca)}</td><td>—</td><td><span class="pill s4">Sin desglose</span></td></tr>`; return; }
    const d=cob-toca; dif+=d; const ok=Math.abs(d)<5000;
    filas+=`<tr><td>${MES_C[k]}</td><td class="num">${fmt(toca)}</td><td class="num">${fmt(cob)}</td><td><span class="pill ${ok?'s1':(d>0?'s3':'s2')}">${ok?'Bien':(d>0?'+':'')+fmtK(d)}</span></td></tr>`; });
  const fondoV=M.fondo?M.fondo.valores:Array(12).fill(null);
  $('app').innerHTML = `
  <section><div class="sec-head"><h2>Mes a mes</h2><p>Barras: cobrado y pagado. Líneas: ganancia y total repartido entre las tres.</p></div>
    <div class="panel"><div class="chart"><canvas id="c-evol" aria-label="Evolución mensual"></canvas></div></div></section>
  <div class="two">
    <section><div class="sec-head"><h2>De dónde viene la plata en ${MESES[i]}</h2></div><div class="panel bars">${barras(ing)}</div></section>
    <section><div class="sec-head"><h2>En qué se va en ${MESES[i]}</h2></div><div class="panel bars">${barras(gas,true)}</div></section>
  </div>
  <section><div class="sec-head"><h2>AySA del edificio</h2><p>Una sola factura para todo Sabattini. Al local le toca el 42,5%. De enero a marzo el local pagó AySA y ABL juntos.</p></div>
    <div class="two"><div class="panel"><div class="chart sm"><canvas id="c-aysa" aria-label="Factura de AySA por mes"></canvas></div></div>
    <div class="panel tbl"><table><thead><tr><th>Factura</th><th>Al local</th><th>Cobrado</th><th>Diferencia</th></tr></thead><tbody>${filas}</tbody><tfoot><tr><td><b>Neto</b></td><td></td><td></td><td class="num"><b>${dif>0?'+':''}${fmtK(dif)}</b></td></tr></tfoot></table></div></div>
    ${M.aysaMica?`<p class="muted" style="margin:0;font-size:.85rem">Mica deposita por el depto 5: ${fmt(M.aysaMica)} por mes (su 9,83% de AySA + ABL).</p>`:''}</section>
  <section><div class="sec-head"><h2>Fondo de ahorro en dólares</h2><p>Con el dólar a ${fmt(tc)} (se cambia en Repartos).</p></div>
    <div class="panel tbl"><table><thead><tr><th>Mes</th><th>Pesos</th><th>Dólares</th><th>Meta USD 100</th></tr></thead><tbody>
    ${conDatos.map(k=>{ const v=fondoV[k]; return `<tr><td>${cap(MESES[k])}</td><td class="num">${isNum(v)?fmt(v):'—'}</td><td class="num">${isNum(v)?usd(v/tc):'—'}</td><td><span class="pill ${isNum(v)&&v/tc>=100?'s1':(isNum(v)?'s2':'s4')}">${isNum(v)&&v/tc>=100?'Cumplida':(isNum(v)?'Corta':'Sin apartar')}</span></td></tr>`; }).join('')}
    </tbody></table></div></section>`;
  dibujar(conDatos,aI,aysa);
}
function barras(items,alt){
  if(!items.length) return '<p class="muted" style="margin:0">Nada anotado este mes.</p>';
  const tot=sum(items.map(x=>x.v)), max=Math.max(...items.map(x=>x.v));
  return items.map(x=>`<div class="bar-row ${alt?'alt':''}"><span>${esc(x.k)}</span><span class="num">${fmtK(x.v)} <span class="pct">${Math.round(x.v/tot*100)}%</span></span><div class="track"><div class="fill" style="width:${(x.v/max*100).toFixed(1)}%"></div></div></div>`).join('');
}
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function dibujar(conDatos,aI,aysa){
  if(!window.Chart) return;
  const ink=css('--ink'),muted=css('--muted'),line=css('--line'),acc=css('--accent'),acc2=css('--accent-2'),soft=css('--accent-soft'),bad=css('--bad');
  Chart.defaults.font.family=css('--f-body'); Chart.defaults.color=muted;
  const money={ticks:{callback:v=>fmtK(v)},grid:{color:line},border:{display:false}};
  const n=conDatos.map(k=>numeros(k+1));
  charts.push(new Chart($('c-evol'),{data:{labels:conDatos.map(k=>MES_C[k]),datasets:[
    {type:'bar',label:'Cobrado',data:n.map(x=>x.c),backgroundColor:soft,borderRadius:4,order:3},
    {type:'bar',label:'Pagado',data:n.map(x=>x.p),backgroundColor:acc2,borderRadius:4,order:3},
    {type:'line',label:'Ganancia',data:n.map(x=>x.g),borderColor:acc,backgroundColor:acc,pointRadius:3,borderWidth:2.5,tension:.25,order:1},
    {type:'line',label:'Repartido',data:n.map(x=>x.totalRep||null),borderColor:bad,backgroundColor:bad,borderDash:[5,4],pointRadius:2,borderWidth:2,tension:.25,order:2}
  ]},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{y:{...money,beginAtZero:true},x:{grid:{display:false}}},
    plugins:{legend:{labels:{color:ink,usePointStyle:true,boxWidth:8}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`}}}}}));
  if(aysa&&aI.length) charts.push(new Chart($('c-aysa'),{type:'line',data:{labels:aI.map(k=>MES_C[k]),datasets:[{label:'Factura',data:aI.map(k=>aysa.valores[k]),borderColor:acc,backgroundColor:soft,fill:true,pointRadius:3,borderWidth:2.5,tension:.25}]},
    options:{maintainAspectRatio:false,scales:{y:money,x:{grid:{display:false}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.parsed.y)}}}}}));
}

// ---------- modal para anotar ----------
function abrirAnotar(fila,mes){
  const f=M.filas.find(x=>x.fila===fila); if(!f) return;
  let m=mes;
  const ultimo=()=>{ for(let k=m-2;k>=0;k--) if(isNum(f.valores[k])) return {k,v:f.valores[k]}; return null; };
  const pintar=()=>{
    const act=f.valores[m-1], u=ultimo();
    $('modal').innerHTML=`<div class="sheet-bg" id="bg"><form class="sheet" id="f-an" role="dialog" aria-modal="true" aria-labelledby="an-t">
      <header><div><div class="eyebrow">${esc(f.detalle)||'&nbsp;'}</div><h2 id="an-t">${esc(f.concepto)}</h2></div><button type="button" class="icon-btn" id="an-x" aria-label="Cerrar">✕</button></header>
      <div class="field"><label for="an-mes">Mes</label><select id="an-mes">${MESES.map((x,k)=>`<option value="${k+1}" ${k+1===m?'selected':''}>${cap(x)} · ${EST[f.estados[k]]}</option>`).join('')}</select></div>
      <div class="field"><label for="an-monto">Monto</label><input id="an-monto" type="text" inputmode="decimal" autocomplete="off" value="${isNum(act)?act.toLocaleString('es-AR'):''}" placeholder="${u?Math.round(u.v).toLocaleString('es-AR'):'0'}">
        <small>${act!=null&&act!==''?'Anotado hoy: '+esc(valorTxt(act))+'. ':''}${u?`Último anotado: ${fmt(u.v)} en ${MESES[u.k]}. <button type="button" class="btn link" id="an-ult">Usar ese</button>`:''}</small></div>
      <div class="field"><span class="eyebrow">Resuelto sin plata</span><div class="chips">${['inquilino','no corresponde','pagado'].map(t=>`<button type="button" class="chip" data-t="${t}">${t}</button>`).join('')}</div></div>
      <div class="actions">
        <button class="btn primary" type="submit">Guardar</button>
        ${isNum(act)?'<button class="btn" type="button" id="an-sum">Sumar</button>':''}
        ${act!=null&&act!==''?'<button class="btn danger" type="button" id="an-del">Borrar</button>':''}
      </div></form></div>`;
    const cerrar=()=>{ $('modal').innerHTML=''; document.removeEventListener('keydown',esc_); };
    const esc_=e=>{ if(e.key==='Escape') cerrar(); };
    document.addEventListener('keydown',esc_);
    $('bg').onclick=e=>{ if(e.target.id==='bg') cerrar(); };
    $('an-x').onclick=cerrar;
    $('an-mes').onchange=e=>{ m=+e.target.value; pintar(); };
    if($('an-ult')) $('an-ult').onclick=()=>{ $('an-monto').value=String(ultimo().v).replace('.',','); };
    const guardar=async valor=>{ if(ocupado) return; if(await anotar([{fila:f.fila,mes:m,concepto:f.concepto,valor}], `${f.concepto} · ${MESES[m-1]}: anotado`)) cerrar(); };
    $('modal').querySelectorAll('.chip[data-t]').forEach(c=>c.onclick=()=>guardar(c.dataset.t));
    $('f-an').onsubmit=e=>{ e.preventDefault(); const v=parseMonto($('an-monto').value); if(v==null||isNaN(v)){ toast('Escribí un monto. Ejemplo: 290.852',true); return; } guardar(v); };
    if($('an-sum')) $('an-sum').onclick=()=>{ const v=parseMonto($('an-monto').value); if(!v||isNaN(v)){ toast('Escribí cuánto sumar.',true); return; } guardar(`=${f.valores[m-1]}+${v}`); };
    if($('an-del')) $('an-del').onclick=()=>guardar('');
    setTimeout(()=>{ const x=$('an-monto'); if(x){ x.focus(); x.select(); } },30);
  };
  pintar();
}

// ---------- error al entrar ----------
function pintarError(error){
  $('top').hidden=true; $('tabs').hidden=true;
  $('app').innerHTML=`<section class="setup panel form">
    <div><div class="eyebrow">PETRO</div><h1 style="font-size:1.6rem">No se pudo abrir</h1></div>
    <p class="pill s3" style="white-space:normal">${esc(error)}</p>
    <p class="muted" style="margin:0">La app usa tu cuenta de Google. Solo entran las cuentas que tienen el Sheet de PETRO compartido como editoras.</p>
    <button class="btn primary" id="reint">Probar de nuevo</button>
  </section>`;
  $('reint').onclick=cargar;
}

let tTimer;
function toast(msg,err){ clearTimeout(tTimer); let t=document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.setAttribute('role','status'); document.body.appendChild(t);} t.className='toast'+(err?' err':''); t.textContent=msg; tTimer=setTimeout(()=>t.remove(),err?6000:2600); }

$('mes').onchange=e=>{ mesSel=+e.target.value; store.set('mes',mesSel); render(); };
$('recargar').onclick=()=>{ if(!ocupado) cargar(); };
window.addEventListener('hashchange',render);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
$('app').innerHTML='<p class="muted">Cargando el Sheet…</p>'; cargar();
})();
</script>
</body>
</html>
