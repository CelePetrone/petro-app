<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PETRO</title>
<meta name="theme-color" content="#F4F3EE">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
/* Layout: menú fijo a la izquierda (cajón en el celu) y contenido a la derecha; tarjetas blancas sobre fondo claro */
:root{
  --bg:#F4F3EE; --surface:#FFFFFF; --side:#FBFAF7; --ink:#2A302E; --muted:#7C807A; --line:#E2E0D8; --line-2:#ECEAE3;
  --accent:#2E8E70; --accent-dark:#1F604C; --accent-soft:#E5F3ED;
  --ok:#2E8E70; --ok-soft:#EAF5F0; --warn:#A86C12; --warn-soft:#FCF2DF; --bad:#B0463A; --bad-soft:#FBEAE7; --none:#AFAEA6; --none-soft:#F3F2EE;
  --chart-2:#E0A84E;
  --f-brand:Georgia,"Times New Roman",serif;
  --f-body:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-body)}
h1,h2,h3{margin:0;line-height:1.25;font-weight:600;text-wrap:balance}
h2{font-size:1.05rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* estructura */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 16px max(14px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-brand);font-size:1.6rem;color:var(--accent-dark);letter-spacing:-.01em;padding:0 10px}
.brand-sub{font-size:.78rem;color:var(--muted);padding:0 10px;margin-bottom:22px}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;color:var(--muted);flex:none}
.nav a:hover{background:var(--line-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-dark)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav .count{margin-left:auto;font-size:.72rem;font-weight:700;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:1px 8px}
.side-foot{margin-top:auto;display:grid;gap:8px;font-size:.78rem;color:var(--muted);padding:0 10px}
.side-foot button{justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.8rem;display:inline-flex;gap:6px;align-items:center}
.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px max(28px,env(safe-area-inset-right,0px)) 12px 28px;border-bottom:1px solid var(--line)}
.bar h1{font-size:1.25rem;margin-right:auto}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;line-height:0}
select,input[type=text],input[type=number]{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);min-width:0}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
main{padding:22px max(28px,env(safe-area-inset-right,0px)) 40px 28px;display:grid;gap:20px;align-content:start;max-width:1280px;width:100%}
section{display:grid;gap:10px;align-content:start;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline;justify-content:space-between}
.sec-head p{margin:0;color:var(--muted);font-size:.84rem;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px;align-items:start}

/* resumen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{padding:14px 18px;border-right:1px solid var(--line-2);display:grid;gap:2px}
.stat:last-child{border-right:0}
.stat .v{font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .s{font-size:.76rem;color:var(--muted)}
.stat.hi .v{color:var(--accent-dark)}
.neg{color:var(--bad)!important}

.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.s1{background:var(--ok-soft);color:var(--ok)}
.pill.s2{background:var(--warn-soft);color:var(--warn)}
.pill.s3{background:var(--bad-soft);color:var(--bad)}
.pill.s0,.pill.s4{background:var(--none-soft);color:var(--muted)}

/* formulario de carga */
.form{display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label,.field .lbl{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field small{color:var(--muted);font-size:.78rem}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.monto{font-size:1.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark)}
.btn.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .primary{flex:1 1 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.8rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark)}

/* pendientes */
.plist{display:grid}
.plist h3{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px;font-weight:600}
.plist h3:first-child{padding-top:0}
.pitem{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;width:100%;background:none;border:0;border-top:1px solid var(--line-2);padding:10px 4px}
.pitem:hover{background:var(--bg)}
.pitem.sel{background:var(--accent-soft)}
.pitem .dot{width:8px;height:8px;border-radius:50%;grid-row:1/3}
.pitem.s2 .dot{background:var(--warn)} .pitem.s3 .dot{background:var(--bad)}
.pitem .c{font-weight:500}
.pitem .d{grid-column:2;font-size:.78rem;color:var(--muted)}
.pitem .m{grid-row:1/3;grid-column:3;text-align:right;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:14px 0;color:var(--muted)}

/* grilla de meses */
.sheet-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:calc(100vh - 150px)}
table.grid{border-collapse:separate;border-spacing:0;font-size:.82rem;width:100%}
.grid th,.grid td{padding:0;border-bottom:1px solid var(--line-2);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.grid thead th{position:sticky;top:0;z-index:2;background:var(--surface);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px 8px;border-bottom:1px solid var(--line)}
.grid .cpt{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:8px 14px;min-width:200px;max-width:240px;white-space:normal;border-right:1px solid var(--line)}
.grid thead .cpt{z-index:3}
.grid .cpt small{display:block;color:var(--muted);font-size:.72rem;line-height:1.3}
.grid tr.sec td{background:var(--bg);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 14px 6px;text-align:left}
.grid tr.sec td span{position:sticky;left:14px}
.grid td.c{min-width:80px;height:36px}
.grid td.c button{all:unset;display:block;box-sizing:border-box;width:100%;height:100%;padding:8px 8px;cursor:pointer;text-align:right}
.grid td.c button:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.grid td.c button:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.grid td.c.s2{background:var(--warn-soft)} .grid td.c.s2 button{color:var(--warn)}
.grid td.c.s3{background:var(--bad-soft)} .grid td.c.s3 button{color:var(--bad)}
.grid td.c.s0 button{color:var(--none)}
.grid td.c.txt button{color:var(--accent-dark);font-style:italic}
.grid td.c input{width:100%;height:36px;border:0;border-radius:0;box-shadow:inset 0 0 0 2px var(--accent);padding:0 10px;text-align:right;background:var(--surface)}
.grid td.tot{padding:8px 12px;color:var(--muted);font-weight:600;min-width:100px}
.grid th.cur,.grid td.cur{box-shadow:inset 1px 0 0 var(--accent),inset -1px 0 0 var(--accent)}
.grid thead th.cur{color:var(--accent-dark);box-shadow:inset 0 3px 0 var(--accent),inset 1px 0 0 var(--accent),inset -1px 0 0 var(--accent)}
.grid tr.calc td{background:var(--side);font-weight:600;padding:8px 10px}
.grid tr.calc td.cpt{background:var(--side)}
.grid tr.calc.big td{font-size:.9rem;color:var(--accent-dark)}
.grid td.saving{opacity:.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* repartos y tablero */
.calc-list{display:grid}
.calc-list div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.calc-list div:last-child{border-bottom:0;font-weight:600}
.calc-list .num{white-space:nowrap}
.big-num{font-size:1.8rem;font-weight:600;color:var(--accent-dark);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:.85rem}
.bar-row .track{grid-column:1/-1;height:7px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar-row .fill{height:100%;background:var(--accent);border-radius:4px}
.bar-row.alt .fill{background:var(--chart-2)}
.bar-row .pct{color:var(--muted);font-size:.78rem}
.tbl{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
.t th,.t td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.t th:first-child,.t td:first-child{text-align:left}
.t th{font-weight:600;color:var(--muted);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.chart{position:relative;height:280px}
.chart.sm{height:220px}
.aj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line-2)}
.aj:first-child{border-top:0}
.aj small{grid-column:1;color:var(--muted);font-size:.78rem}
.aj .pill{grid-row:1/3;grid-column:2;align-self:center}


/* para revisar */
.rev{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:14px;padding:12px 16px}
.rev.ok{border-left-color:var(--ok);color:var(--ok)}
.rev-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rev summary{cursor:pointer;font-size:.82rem;color:var(--accent);font-weight:600;padding:8px 4px 0;border-top:1px solid var(--line-2)}
.rev details[open] summary{padding-bottom:4px}
.rev-list{display:grid;margin-top:8px}
.rev-i{display:grid;grid-template-columns:8px minmax(0,1fr);gap:0 12px;align-items:center;padding:8px 4px;border-top:1px solid var(--line-2);color:var(--ink);text-decoration:none}
.rev-i:hover{background:var(--bg)}
.rev-i .dot{width:8px;height:8px;border-radius:50%;grid-row:1/3;background:var(--none)}
.rev-i.n3 .dot{background:var(--bad)} .rev-i.n2 .dot{background:var(--warn)}
.rev-i .c{font-weight:500} .rev-i .d{grid-column:2;font-size:.78rem;color:var(--muted)}
.legend .raro-l::before{background:none;box-shadow:inset 0 0 0 2px var(--bad)}
.grid td.c.raro{box-shadow:inset 0 0 0 2px var(--bad)}

/* versión B: lista para anotar directo */
.qlist{padding:4px 14px}
.q{display:grid;grid-template-columns:8px minmax(0,1fr) 150px auto 64px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2)}
.q:first-child{border-top:0}
.q .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)} .q.s3 .dot{background:var(--bad)}
.q .c{font-weight:500} .q .c small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.q.s3 .c small b{color:var(--bad)}
.q input{text-align:right;font-variant-numeric:tabular-nums}
.q .btn{padding:8px 14px}
.q select{padding:8px 6px;color:var(--muted)}
@media (max-width:640px){ .q{grid-template-columns:8px minmax(0,1fr) auto 52px;row-gap:6px} .q .c{grid-column:2/5} .q .dot{grid-row:1} .q input{grid-column:2} }

/* versión B: más fresca, azul petróleo, tarjetas sin borde */
.dis-b{
  --bg:#F3F6F8; --surface:#FFFFFF; --side:#FFFFFF; --ink:#1F2A33; --muted:#6B7884; --line:#DDE4EA; --line-2:#EBF0F3;
  --accent:#2F6F8F; --accent-dark:#1F4F68; --accent-soft:#E3EEF4; --ok:#2F8A64; --ok-soft:#E5F4EC; --chart-2:#E39A62;
  --f-brand:"Segoe UI",system-ui,sans-serif;
}
.dis-b .card,.dis-b .stats,.dis-b .sheet-wrap,.dis-b .rev{border-color:transparent;box-shadow:0 1px 3px rgba(20,40,60,.07),0 4px 14px rgba(20,40,60,.04)}
.dis-b .rev{border-left-color:var(--bad)} .dis-b .rev.ok{border-left-color:var(--ok)}
.dis-b .brand{font-weight:800;letter-spacing:.06em;font-size:1.35rem}
.dis-b .nav a[aria-current="page"]{background:var(--accent);color:#fff} .dis-b .nav a[aria-current="page"] svg{color:#fff}


/* meses: de a uno */
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.mo{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0 7px;display:grid;gap:5px;justify-items:center;font-weight:600;font-size:.84rem;color:var(--ink)}
.mo i{width:60%;height:4px;border-radius:2px;background:var(--none)}
.mo.e1 i{background:var(--ok)} .mo.e2 i{background:var(--warn)} .mo.e3 i{background:var(--bad)} .mo.e4{color:var(--muted)}
.mo[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.mo[aria-pressed="true"] i{box-shadow:0 0 0 1.5px #fff}
.mblock{padding:6px 18px 8px}
.mhead,.mrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 150px 64px;gap:12px;align-items:center}
.mhead{padding:12px 0 8px;border-bottom:1px solid var(--line)}
.mhead .ant,.mhead .val{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right}
.mrow{padding:7px 0;border-bottom:1px solid var(--line-2)}
.mrow:last-child{border-bottom:0}
.mrow .c small{display:block;color:var(--muted);font-size:.76rem}
.mrow .ant{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.86rem}
.mrow .ant small{font-size:.7rem;margin-right:6px}
.mrow .val{text-align:right;font-variant-numeric:tabular-nums}
.mrow .val button{width:100%;text-align:right;border:1px solid transparent;background:none;border-radius:8px;padding:7px 10px;font-weight:600;font-size:.95rem}
.mrow .val button:hover{border-color:var(--line);background:var(--bg)}
.mrow .val input{width:100%;text-align:right;font-weight:600}
.mrow .val.s2 button{background:var(--warn-soft);color:var(--warn);font-size:.82rem}
.mrow .val.s3 button{background:var(--bad-soft);color:var(--bad);font-size:.82rem}
.mrow .val.s0 button{color:var(--none);font-weight:400}
.mrow .val.txt button{color:var(--accent-dark);font-style:italic;font-weight:500}
.mrow .val.raro button{box-shadow:inset 0 0 0 2px var(--bad)}
.mrow .val.saving{opacity:.5}
.mrow.tot{border-top:1px solid var(--line);font-weight:600}
.mrow.tot .val{padding-right:11px}
.chg{font-size:.74rem;font-weight:600;white-space:nowrap}
.chg.up{color:var(--warn)} .chg.down{color:var(--accent)}
@media (max-width:640px){
  .months{grid-template-columns:repeat(6,minmax(0,1fr))}
  .mblock{padding:4px 12px 6px}
  .mhead,.mrow{grid-template-columns:minmax(0,1fr) 112px;gap:2px 10px}
  .mhead .ant,.mhead span:last-child{display:none}
  .mrow .ant{grid-row:2;grid-column:1;text-align:left;font-size:.76rem}
  .mrow .ant:empty{display:none}
  .mrow .val{grid-row:1/3;grid-column:2}
  .mrow .chgw{grid-row:3;grid-column:2;text-align:right}
  .mrow .chgw:empty{display:none}
}


/* tonos intermedios */
.dis-b.tono-gris{
  --bg:#D6DDE2; --surface:#E9EEF1; --side:#DFE6EA; --ink:#1E2A32; --muted:#56646E; --line:#C2CCD3; --line-2:#D2DAE0;
  --accent:#2A6683; --accent-dark:#1B4A61; --accent-soft:#CFE0E9;
  --ok:#2A7D59; --ok-soft:#D1E6DB; --warn:#94600F; --warn-soft:#F0E0C2; --bad:#A63E33; --bad-soft:#EFD3CE; --none:#8C979E; --none-soft:#D9DFE3;
}
.dis-b.tono-pizarra{
  --bg:#27333B; --surface:#33414A; --side:#2C3941; --ink:#E4EAEE; --muted:#A2B0B9; --line:#46555F; --line-2:#3C4A53;
  --accent:#72B5D3; --accent-dark:#A6D3E8; --accent-soft:#3A5666;
  --ok:#6CC59A; --ok-soft:#2F4A3F; --warn:#E3B467; --warn-soft:#4C4333; --bad:#EE8C80; --bad-soft:#543A38; --none:#7E8C94; --none-soft:#3A474F;
  color-scheme:dark;
}
.tono-pizarra .btn.primary,.tono-pizarra .nav a[aria-current="page"],.tono-pizarra .mo[aria-pressed="true"]{color:#10232D}
.tono-pizarra .nav a[aria-current="page"] svg{color:#10232D}
.tono-pizarra .toast{color:#1E2A32}

.dis-b.tono-pizarra .card,.dis-b.tono-pizarra .stats,.dis-b.tono-pizarra .rev{box-shadow:0 1px 0 rgba(255,255,255,.03),0 6px 18px rgba(0,0,0,.18)}

.hist{display:grid;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.hist div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:7px 12px;border-top:1px solid var(--line-2);font-size:.84rem}
.hist div:first-child{border-top:0}
.hist div span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}

/* colorcitos: verde hecho, amarillo a la espera, rojo falta */
.stat{position:relative}
.stat.ok,.stat.warn,.stat.bad{box-shadow:inset 0 3px 0 var(--c)}
.stat.ok{--c:var(--ok)} .stat.warn{--c:var(--warn)} .stat.bad{--c:var(--bad)}
.stat.ok .eyebrow{color:var(--ok)} .stat.warn .eyebrow{color:var(--warn)} .stat.bad .eyebrow{color:var(--bad)}
.stat.hi{box-shadow:inset 0 3px 0 var(--accent)}
.mrow .c .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px;background:var(--none)}

/* entrar */

}

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){
'use strict';
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES_C = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const EST = {0:'No corresponde',1:'Anotado',2:'Toca este mes',3:'Atrasado',4:'Más adelante'};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const isNum = v => typeof v==='number' && isFinite(v);
const fmt = n => (n<0?'−':'')+'$ '+Math.round(Math.abs(n)).toLocaleString('es-AR');
const fmtK = n => { const a=Math.abs(n); return (n<0?'−':'')+'$ '+(a>=1e6?(a/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M':Math.round(a/1e3)+' mil'); };
const usd = n => 'USD '+Math.round(n).toLocaleString('es-AR');
const sum = a => a.reduce((x,y)=>x+(isNum(y)?y:0),0);
const store = {
  get(k,d){ try{const v=localStorage.getItem('petro-'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem('petro-'+k,JSON.stringify(v));}catch(e){} }
};
// "1.234.567" / "1234567,5" / "1234567" → número
function parseMonto(s){
  s=String(s).trim().replace(/\$|\s/g,'');
  if(!s) return null;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(',','.');
  const n=Number(s); return isFinite(n)?n:NaN;
}

let raw = null, M = null, mesSel = null, ocupado = false;
let tc = store.get('tc',1450);
let charts = [];
// diseño elegido (a o b); se puede forzar con ?d=b
const DIS = (new URLSearchParams(location.search).get('d')||store.get('diseno','b'))==='a'?'a':'b';
if(DIS==='b') document.documentElement.classList.add('dis-b');
const TONO = new URLSearchParams(location.search).get('t')||store.get('tono','pizarra');
document.documentElement.classList.add('tono-'+TONO);

// ---------- conexión con Google: entrar con la cuenta y usar la API de Sheets ----------
const CFG = window.PETRO_CONFIG || {};
const SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets/';
const SCOPE_SHEETS = 'https://www.googleapis.com/auth/spreadsheets';
const SCOPES = SCOPE_SHEETS + ' openid email';
const CONTROL = "'Control 2026'";
const RANGOS = { control: CONTROL+'!A1:AK60', unidades: "'Unidades'!A1:M12", aysa: "'AySA'!A1:N47", fondo: "'Fondo de ahorro'!A1:K30" };
const TAMANO = { control:[60,37], unidades:[12,13], aysa:[47,14], fondo:[30,11] };
const REGISTRO = 'Registro app';
const SIN_ACCESO = 'Tu cuenta de Google no tiene acceso al Sheet de PETRO. Pedile a Cele que te lo comparta como editora.';
let token = store.get('token',null), tokenClient = null, esperando = [];

function pedirToken(prompt){
  return new Promise((ok,mal)=>{
    if(!(window.google&&google.accounts&&google.accounts.oauth2)) return mal(new Error('No cargó el ingreso de Google. Revisá la conexión o los bloqueos del navegador.'));
    esperando.push({ok,mal}); if(esperando.length>1) return;
    if(!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CFG.googleClientId, scope: SCOPES,
      callback: r=>{ const w=esperando; esperando=[];
        if(r.error) return w.forEach(x=>x.mal(new Error(r.error)));
        if(!google.accounts.oauth2.hasGrantedAllScopes(r,SCOPE_SHEETS)) return w.forEach(x=>x.mal(new Error('Hace falta tildar el permiso para ver y editar las hojas de cálculo.')));
        token={v:r.access_token,exp:Date.now()+(r.expires_in-60)*1000}; store.set('token',token); w.forEach(x=>x.ok(token.v)); },
      error_callback: e=>{ const w=esperando; esperando=[];
        const m = e&&e.type==='popup_closed' ? 'Se cerró la ventana de Google antes de terminar. Si usás Brave, desactivá los escudos para esta página.' : e&&e.type==='popup_failed_to_open' ? 'El navegador bloqueó la ventana de Google. Permití las ventanas emergentes para esta página.' : 'No se pudo entrar con Google.';
        w.forEach(x=>x.mal(new Error(m))); }
    });
    tokenClient.requestAccessToken({prompt, login_hint: store.get('email','')||undefined});
  });
}
const tokenOk = () => token && token.exp > Date.now();
async function gfetch(url, opts, reintento){
  if(!tokenOk()) throw Object.assign(new Error('Se venció la conexión con Google (dura una hora).'),{vencido:true});
  const r = await fetch(url, Object.assign({}, opts||{}, {headers:{Authorization:'Bearer '+token.v,'Content-Type':'application/json'}}));
  if(r.status===401){ token=null; store.set('token',null); throw Object.assign(new Error('Se venció la conexión con Google.'),{vencido:true}); }
  if(r.status===429 && !reintento){ await new Promise(x=>setTimeout(x,8000)); return gfetch(url,opts,true); }
  if(!r.ok){ let m=r.status+''; try{ const j=await r.json(); m=(j.error&&j.error.message)||m; }catch(e){}
    if(r.status===403||r.status===404) throw new Error(SIN_ACCESO);
    throw new Error('Google respondió: '+m); }
  return r.json();
}
function rellenar(filas,[nf,nc]){ const out=[]; for(let i=0;i<nf;i++){ const f=(filas&&filas[i])||[]; const r=[]; for(let c=0;c<nc;c++) r.push(f[c]===undefined?'':f[c]); out.push(r);} return out; }
async function leerSheet(){
  const qs = Object.values(RANGOS).map(r=>'ranges='+encodeURIComponent(r)).join('&');
  const j = await gfetch(SHEETS+CFG.sheetId+'/values:batchGet?'+qs+'&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER');
  const d = {leido:new Date().toISOString()};
  Object.keys(RANGOS).forEach((k,i)=>{ d[k]=rellenar(j.valueRanges[i].values,TAMANO[k]); });
  // en Unidades, "Próximo ajuste" viene como número de serie de fecha
  d.unidades.forEach((r,i)=>{ if(i>=3 && isNum(r[8])) r[8]=new Date(Date.UTC(1899,11,30)+r[8]*864e5).toISOString(); });
  // registro de cambios (para ver de dónde salió cada reparto); si no existe todavía, no pasa nada
  try{ const r=await gfetch(SHEETS+CFG.sheetId+'/values/'+encodeURIComponent(`'${REGISTRO}'!A2:G3000`)); d.registro=r.values||[]; }catch(e){ if(e.vencido) throw e; d.registro=[]; }
  for(const [k,h] of [['otros',OTROS],['tarjeta',TARJETA]]){
    try{ const r=await gfetch(SHEETS+CFG.sheetId+'/values/'+encodeURIComponent(`'${h}'!A2:J2000`)+'?valueRenderOption=UNFORMATTED_VALUE'); d[k]=r.values||[]; }catch(e){ if(e.vencido) throw e; d[k]=[]; }
  }
  return d;
}
async function quienSoy(){
  let e = store.get('email','');
  if(!e){ try{ const u=await gfetch('https://www.googleapis.com/oauth2/v3/userinfo'); e=u.email||''; store.set('email',e); }catch(x){} }
  return e;
}
const esCuentaSimple = f => /^=[\d\s.,+\-*/()]+$/.test(f);
const letra = n => { let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; };
async function anotarSheet(items, email){
  // primero se controla todo; si algo no cierra, no se escribe nada
  const rangos=[]; items.forEach(it=>{ rangos.push(`${CONTROL}!B${it.fila}:D${it.fila}`); rangos.push(`${CONTROL}!${letra(5+it.mes)}${it.fila}`); });
  const j = await gfetch(SHEETS+CFG.sheetId+'/values:batchGet?'+rangos.map(r=>'ranges='+encodeURIComponent(r)).join('&')+'&valueRenderOption=FORMULA');
  const datos=[], borrar=[], reg=[];
  items.forEach((it,k)=>{
    const fila=(j.valueRanges[2*k].values||[[]])[0]; const concepto=String(fila[0]||'').trim(); const frec=String(fila[2]||'').trim();
    const antes=((j.valueRanges[2*k+1].values||[[]])[0]||[])[0]; const antesTxt = antes===undefined||antes===''?'':String(antes);
    if(concepto!==String(it.concepto).trim()) throw new Error(`La fila de "${it.concepto}" cambió en el Sheet. Tocá recargar y probá de nuevo.`);
    if(!frec) throw new Error(`"${concepto}" no se carga a mano.`);
    if(antesTxt.charAt(0)==='=' && !esCuentaSimple(antesTxt)) throw new Error('Esa celda tiene una fórmula y no se toca desde la app.');
    const v=it.valor; const rango=`${CONTROL}!${letra(5+it.mes)}${it.fila}`;
    const valido = v===''||v===null||isNum(v)||(typeof v==='string'&&(esCuentaSimple(v)||(v.charAt(0)!=='='&&v.length<=40)));
    if(!valido) throw new Error(`El valor para "${concepto}" no es válido.`);
    if(v===''||v===null) borrar.push(rango); else datos.push({range:rango,values:[[v]]});
    const celdaReg = x => x===undefined||x===''||x===null ? '(vacío)' : isNum(x) ? x : "'"+x;
    reg.push([new Date().toLocaleString('es-AR'), email||'sin mail', concepto, MESES[it.mes-1], celdaReg(antes), celdaReg(v), it.detalle||'']);
  });
  if(datos.length) await gfetch(SHEETS+CFG.sheetId+'/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'USER_ENTERED',data:datos})});
  if(borrar.length) await gfetch(SHEETS+CFG.sheetId+'/values:batchClear',{method:'POST',body:JSON.stringify({ranges:borrar})});
  await registrar(reg);
}
const OTROS = 'Otros movimientos', TARJETA = 'Deudas internas';
const ENCAB = {
  [OTROS]: ['Fecha','Mes','Tipo','Qué es','Monto','Cargó'],
  [TARJETA]: ['Fecha','Quién','Tipo','Qué','Monto total','Cuotas','Año primera cuota','Mes primera cuota','Cuotas descontadas','Cargó'],
};
// agrega filas al final de una hoja; si la hoja no existe, la crea con su encabezado
async function agregarFilas(hoja, filas){
  const url = SHEETS+CFG.sheetId+'/values/'+encodeURIComponent(`'${hoja}'!A:J`)+':append?valueInputOption=USER_ENTERED';
  try{ await gfetch(url,{method:'POST',body:JSON.stringify({values:filas})}); }
  catch(e){
    if(e.vencido) throw e;
    await gfetch(SHEETS+CFG.sheetId+':batchUpdate',{method:'POST',body:JSON.stringify({requests:[{addSheet:{properties:{title:hoja,gridProperties:{frozenRowCount:1}}}}]})});
    await gfetch(url,{method:'POST',body:JSON.stringify({values:[ENCAB[hoja]].concat(filas)})});
  }
}
async function anotarOtro(o, email){
  if(!o.que||!String(o.que).trim()) throw new Error('Escribí qué es.');
  if(!isNum(o.monto)||o.monto<=0) throw new Error('Escribí un monto válido.');
  const hoy=new Date().toLocaleString('es-AR');
  await agregarFilas(OTROS,[[hoy, MESES[o.mes-1], o.tipo==='ingreso'?'Ingreso':'Pago', "'"+String(o.que).slice(0,80), o.monto, email||'']]);
  await registrar([[hoy, email||'sin mail', 'Otro: '+String(o.que).slice(0,80), MESES[o.mes-1], '(vacío)', o.monto, o.tipo==='ingreso'?'Ingreso':'Pago']]);
}
async function anotarTarjeta(t, email){
  const hoy=new Date().toLocaleString('es-AR');
  if(t.nueva){ const x=t.nueva;
    if(!['Mica','Anto','Cele'].includes(x.quien)||!x.que||!isNum(x.monto)||x.monto<=0||!(x.cuotas>=1&&x.cuotas<=24)) throw new Error('Revisá los datos de la compra.');
    const tipo = x.tipo==='prestamo'?'Préstamo':'Tarjeta';
    await agregarFilas(TARJETA,[[hoy, x.quien, tipo, "'"+String(x.que).slice(0,80), x.monto, x.cuotas, x.anio, x.mes, 0, email||'']]);
    await registrar([[hoy, email||'sin mail', tipo+' · '+x.quien, MESES[x.mes-1], '(vacío)', x.monto, `${x.que} en ${x.cuotas} cuota${x.cuotas>1?'s':''}`]]);
  }
  if(t.descontar&&t.descontar.length){
    // se controla que cada fila siga siendo la misma compra antes de marcarla
    const j=await gfetch(SHEETS+CFG.sheetId+'/values:batchGet?'+t.descontar.map(x=>'ranges='+encodeURIComponent(`'${TARJETA}'!B${x.fila}:I${x.fila}`)).join('&')+'&valueRenderOption=UNFORMATTED_VALUE');
    const data=t.descontar.map((x,k)=>{ const r=(j.valueRanges[k].values||[[]])[0]||[];
      if(r[0]!==x.quien||String(r[2]).replace(/^'/,'')!==String(x.que)) throw new Error('La lista de la tarjeta cambió. Tocá "Traer lo último" y probá de nuevo.');
      return {range:`'${TARJETA}'!I${x.fila}`,values:[[x.descontadas]]}; });
    await gfetch(SHEETS+CFG.sheetId+'/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'USER_ENTERED',data})});
  }
}
async function registrar(filas){
  const url = SHEETS+CFG.sheetId+'/values/'+encodeURIComponent(`'${REGISTRO}'!A:G`)+':append?valueInputOption=USER_ENTERED';
  try{ await gfetch(url,{method:'POST',body:JSON.stringify({values:filas})}); }
  catch(e){
    if(e.vencido) throw e;
    // la hoja de registro no existe todavía: se crea con su encabezado
    try{
      await gfetch(SHEETS+CFG.sheetId+':batchUpdate',{method:'POST',body:JSON.stringify({requests:[{addSheet:{properties:{title:REGISTRO,gridProperties:{frozenRowCount:1}}}}]})});
      await gfetch(url,{method:'POST',body:JSON.stringify({values:[['Fecha','Quién','Concepto','Mes','Antes','Ahora','Detalle']].concat(filas)})});
    }catch(e2){ toast('Se anotó, pero no se pudo dejar en el registro.',true); }
  }
}
// Fondo: si se pasa a dólares, se anota en "Fondo de ahorro" (columnas H e I del mes; J se calcula sola)
async function anotarDolares(x, email){
  const fila=13+x.mes, H=`'Fondo de ahorro'!B${fila}:J${fila}`;
  const j=await gfetch(SHEETS+CFG.sheetId+'/values/'+encodeURIComponent(H)+'?valueRenderOption=FORMULA');
  const r=(j.values||[[]])[0]||[];
  if(String(r[0]||'').trim().toLowerCase()!==MESES[x.mes-1]) throw new Error('La hoja "Fondo de ahorro" cambió de forma. Avisale a Cele.');
  const hA=r[6], iA=r[7];
  if([hA,iA].some(v=>typeof v==='string'&&v.charAt(0)==='=')) throw new Error('Esas celdas del fondo tienen fórmula y no se tocan desde la app.');
  const hN=isNum(hA)?hA:0, usdA=isNum(hA)&&isNum(iA)&&iA?hA/iA:0;
  const pesos=hN+x.pesos, tcN=Math.round(pesos/(usdA+x.pesos/x.tc)*100)/100;
  await gfetch(SHEETS+CFG.sheetId+'/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'USER_ENTERED',data:[{range:`'Fondo de ahorro'!H${fila}:I${fila}`,values:[[pesos,tcN]]}]})});
  await registrar([[new Date().toLocaleString('es-AR'), email||'sin mail', 'Fondo · pasado a dólares', MESES[x.mes-1], hA===''||hA==null?'(vacío)':hA, pesos, `USD ${Math.round(x.pesos/x.tc)} a $${x.tc}`]]);
}
async function api(cuerpo){
  if(!tokenOk()) throw Object.assign(new Error('Hace falta entrar con Google.'),{vencido:true});
  const email = await quienSoy();

function parsear(d){
  const C = d.control, filas = [];
  let seccion='';
  for(let i=4;i<C.length;i++){
    const r=C[i]; const concepto=String(r[1]||'').trim(); if(!concepto) continue;
    if(/^(Total|GANANCIA|Le toca|Cosas pendientes|Quedó)/.test(concepto)) continue;
    if(!String(r[3]||'').trim() && concepto.split(' · ')[0]===concepto.split(' · ')[0].toUpperCase()){ seccion=concepto.toUpperCase(); continue; }
    const valores=r.slice(5,17).map(v=>v===''?null:v);
    const estados=r.slice(21,33).map(v=>isNum(v)?v:0);
    let tipo='otro', grupo='';
    if(seccion.startsWith('INGRESOS')) tipo='ingreso';
    else if(seccion.startsWith('FUERA')) tipo='fuera';
    else if(seccion.startsWith('GASTOS')){ tipo='gasto'; grupo=grupoGasto(seccion,concepto); }
    else if(seccion.startsWith('REPARTOS')) tipo=/^Apartado/.test(concepto)?'fondo':'reparto';
    else if(seccion.startsWith('DEPÓSITOS')) tipo='deposito';
    filas.push({fila:i+1,concepto,detalle:String(r[2]||''),frec:String(r[3]||''),seccion,tipo,grupo,valores,estados,
      rank:isNum(r[33])?r[33]:null, pendMeses:String(r[34]||''), pendEstado:String(r[35]||'')});
  }
  const secciones=[]; filas.forEach(f=>{ if(!secciones.includes(f.seccion)) secciones.push(f.seccion); });
  const de = t => filas.filter(f=>f.tipo===t);
  const ingresos=de('ingreso'), gastos=de('gasto');
  const col=(rows,m)=>sum(rows.map(r=>isNum(r.valores[m])?r.valores[m]:0));
  // movimientos "Otro" (hoja Otros movimientos): suman a lo cobrado y pagado del mes
  const otros=(d.otros||[]).map(r=>({fecha:r[0],mes:MESES.indexOf(String(r[1]).toLowerCase())+1,tipo:String(r[2]).toLowerCase()==='ingreso'?'ingreso':'pago',que:String(r[3]||'').replace(/^'/,''),monto:isNum(r[4])?r[4]:0,quien:r[5]||''})).filter(o=>o.mes>0&&o.monto);
  const deOtros=(t,m)=>sum(otros.filter(o=>o.tipo===t&&o.mes===m+1).map(o=>o.monto));
  const cobrado=[...Array(12)].map((_,m)=>col(ingresos,m)+deOtros('ingreso',m));
  const pagado=[...Array(12)].map((_,m)=>col(gastos,m)+deOtros('pago',m));
  // compras personales con la tarjeta del negocio
  const tarjeta=(d.tarjeta||[]).map((r,k)=>({fila:k+2,fecha:r[0],quien:r[1],tipo:String(r[2]).toLowerCase().startsWith('pr')?'prestamo':'tarjeta',que:String(r[3]||'').replace(/^'/,''),monto:isNum(r[4])?r[4]:0,cuotas:isNum(r[5])&&r[5]>=1?r[5]:1,anio:isNum(r[6])?r[6]:null,mes:isNum(r[7])?r[7]:null,descontadas:isNum(r[8])?r[8]:0})).filter(t=>t.quien&&t.monto&&t.anio&&t.mes);
  const reparto={}; de('reparto').forEach(f=>{ reparto[f.concepto.replace('Reparto ','')]=f; });
  const fondo=filas.find(f=>f.tipo==='fondo');
  // unidades
  const U=d.unidades||[], unidades=[];
  for(let i=3;i<U.length;i++){ const r=U[i]; if(r[3]!=='Sí'||!r[8]) continue;
    unidades.push({unidad:r[1],quien:r[2],alquiler:r[4],indice:`${r[6]} cada ${r[7]} meses`,proximo:new Date(r[8])}); }
  // AySA
  const A=d.aysa||[];
  const aysaReserva = A[7]&&isNum(A[7][12])?A[7][12]:null;
  const aysaMica = A[15]&&isNum(A[15][12])?A[15][12]:null;
  let cobLocal=Array(12).fill(null);
  for(let i=28;i<A.length;i++){ if(A[i][1]==='Mes'&&A[i][3]==='Local: AySA'){ for(let m=0;m<12;m++){ const v=(A[i+1+m]||[])[3]; cobLocal[m]=isNum(v)?v:null; } break; } }
  const F=d.fondo||[];
  const fondoMensual = F[4]&&isNum(F[4][4])?F[4][4]:null;
  const fondoPesos = F[4]&&isNum(F[4][8])?F[4][8]:null, fondoUSD = F[5]&&isNum(F[5][8])?F[5][8]:null;
  const usdMes = [...Array(12)].map((_,k)=>{ const r=F[13+k]||[]; return isNum(r[9])?r[9]:null; });
  const registro = (d.registro||[]).map(r=>({fecha:r[0],quien:r[1],concepto:r[2],mes:r[3],antes:r[4],ahora:r[5],detalle:r[6]||''}));
  const mesReunion = isNum(C[1][5])?C[1][5]:(new Date().getMonth()+1);
  return {filas,secciones,ingresos,gastos,cobrado,pagado,reparto,fondo,unidades,aysaReserva,aysaMica,cobLocal,fondoMensual,fondoPesos,fondoUSD,usdMes,registro,otros,tarjeta,mesReunion,
    anio:isNum(C[1][2])?C[1][2]:new Date().getFullYear(), leido:d.leido, demo:!!d.demo};
}
function grupoGasto(sec,c){
  c=c.toLowerCase();
  if(c.startsWith('aysa')) return 'AySA';
  if(c.startsWith('abl')) return 'ABL / TSG';
  if(c.startsWith('arba')) return 'ARBA';
  if(c.includes('tarjeta')) return 'Tarjeta';
  if(c.includes('arreglo')) return 'Arreglos';
  if(sec.includes('SAN MART')) return 'San Martín';
  if(sec.includes('IMPUESTO')) return 'Monotributo e IIBB';
  return 'Otros';
}

// ---------- errores y cosas para revisar ----------
function revisar(m){
  const out=[], masRep=[], fondoCorto=[], hoy=new Date(); hoy.setHours(0,0,0,0);
  const atr=pendientes(m).filter(p=>p.st===3);
  if(atr.length) out.push({n:3,t:`${atr.length} ${atr.length===1?'cosa atrasada':'cosas atrasadas'} de meses anteriores`,d:[...new Set(atr.map(p=>p.f.concepto))].slice(0,4).join(', '),ir:'cargar'});
  for(let k=0;k<m;k++){ const n=numeros(k+1);
    if(n.totalRep+n.fondo>n.g+1 && n.totalRep) masRep.push({k,dif:n.totalRep+n.fondo-n.g});
    const dk=descuentos(k+1); const vs=['Mica','Anto','Cele'].map(h=>M.reparto[h]&&isNum(M.reparto[h].valores[k])?M.reparto[h].valores[k]+totalDesc(dk[h]):null).filter(isNum);
    if(vs.length>1 && Math.max(...vs)-Math.min(...vs)>1) out.push({n:2,t:`Repartos distintos en ${MESES[k]}`,d:['Mica','Anto','Cele'].filter(h=>M.reparto[h]).map(h=>h+' '+(valorTxt(M.reparto[h].valores[k])||'—')).join(' · '),ir:'meses',mes:k+1});
  }
  if(masRep.length) out.push({n:3,t:`Se repartió más de lo que se ganó en ${masRep.length} ${masRep.length===1?'mes':'meses'}`,d:masRep.map(x=>MESES[x.k]+' (+'+fmtK(x.dif)+')').join(', ')+'. Sale de la plata que había en la cuenta.',ir:'meses',mes:masRep[masRep.length-1].k+1});
  // montos raros: mucho más alto o más bajo que lo habitual de ese concepto (posible error al tipear)
  M.filas.filter(f=>esCobro(f)||esPago(f)).forEach(f=>{ for(let k=1;k<m;k++){ const v=f.valores[k]; if(!isNum(v)||!v) continue;
    const prev=f.valores.slice(Math.max(0,k-4),k).filter(x=>isNum(x)&&x>0); if(prev.length<2) continue;
    const prom=sum(prev)/prev.length; if(v>prom*2.5||v<prom/4) out.push({n:2,t:`${f.concepto} en ${MESES[k]} parece ${v>prom?'muy alto':'muy bajo'}`,d:`${fmt(v)}, cuando lo habitual es cerca de ${fmt(prom)}. Revisá que no falte o sobre un cero.`,ir:'meses',mes:k+1,celda:f.fila+'-'+k}); } });
  const aysa=M.gastos.find(f=>f.grupo==='AySA');
  if(aysa) for(let k=3;k<m;k++){ const v=aysa.valores[k], c=M.cobLocal[k]; if(isNum(v)&&isNum(c)&&Math.abs(c-v*.425)>=5000) out.push({n:2,t:`AySA al local en ${MESES[k]} no coincide`,d:`Le tocaba ${fmt(v*.425)} y se cobró ${fmt(c)}`,ir:'tablero'}); }
  M.unidades.forEach(u=>{ if(u.proximo<hoy) out.push({n:3,t:`Ajuste de alquiler vencido: ${u.unidad}`,d:`Tocaba en ${MESES[u.proximo.getMonth()]} ${u.proximo.getFullYear()} · ${u.indice}`,ir:'tablero'}); });
  if(M.fondo) for(let k=0;k<m-1;k++){ const v=M.fondo.valores[k]; if(M.cobrado[k]>0 && usdAhorrado(k)<META_USD-0.5) fondoCorto.push(MESES[k]+(usdAhorrado(k)?' ('+usd(usdAhorrado(k))+')':'')); }
  if(fondoCorto.length) out.push({n:1,t:`Fondo debajo de USD ${META_USD} en ${fondoCorto.length} ${fondoCorto.length===1?'mes':'meses'}`,d:fondoCorto.join(', '),ir:'repartos'});
  return out.sort((a,b)=>b.n-a.n);
}

function editarCelda(b){
  const f=M.filas.find(x=>x.fila===+b.dataset.fila), m=+b.dataset.mes, act=f.valores[m-1], td=b.parentNode;
  const inp=document.createElement('input'); inp.type='text'; inp.inputMode='decimal';
  inp.value=act==null?'':(isNum(act)?nro(act):act); inp.setAttribute('aria-label',f.concepto+' · '+MESES[m-1]);
  td.replaceChildren(inp); inp.focus(); inp.select();
  let listo=false;
  const volver=()=>{ if(listo) return; listo=true; td.replaceChildren(b); };
  const guardar=async()=>{
    if(listo) return; const s=inp.value.trim(); const n=parseMonto(s);
    let v = s===''?'':(n!=null&&!isNaN(n)?n:s);
    if(v===act||(v===''&&act==null)||(isNum(act)&&isNum(v)&&Math.round(act)===v)){ volver(); return; }
    listo=true; td.classList.add('saving');
    await anotar([{fila:f.fila,mes:m,concepto:f.concepto,valor:v}], `${f.concepto} · ${MESES[m-1]}: anotado`);
    if(td.isConnected){ td.classList.remove('saving'); td.replaceChildren(b); }
  };
  inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); guardar(); } else if(e.key==='Escape'){ volver(); b.focus(); } };
  inp.onblur=()=>guardar();
}

// ---------- Deudas internas (préstamos y tarjeta): lo que se le descuenta a cada una ----------
// cada compra se descuenta en cuotas: la cuota k cae en el mes (primera + k)
const idxMes=(a,m)=>a*12+m;
function cuotaDe(t){ return Math.round(t.monto/t.cuotas); }
function cuotasHasta(t,m){ const n=idxMes(M.anio,m)-idxMes(t.anio,t.mes)+1; return Math.max(0,Math.min(n,t.cuotas)); }
function cuotaEnMes(t,m){ const k=idxMes(M.anio,m)-idxMes(t.anio,t.mes); return k>=0&&k<t.cuotas; }
function descuentos(m){ const out={Mica:[],Anto:[],Cele:[]};
  (M.tarjeta||[]).forEach(t=>{ if(cuotaEnMes(t,m)&&out[t.quien]) out[t.quien].push(t); });
  return out; }
const totalDesc = l => sum(l.map(cuotaDe));
function estadoCompra(t){
  const hasta=cuotasHasta(t,mesSel);
  if(t.descontadas>=t.cuotas) return {st:1,txt:'Saldada'};
  if(t.descontadas<hasta-(cuotaEnMes(t,mesSel)?1:0)) return {st:3,txt:'Falta descontar'};
  if(cuotaEnMes(t,mesSel)) return {st:2,txt:`Se descuenta en ${MESES[mesSel-1]}`};
  return {st:4,txt:`Empieza en ${MESES[t.mes-1]}`};
}

        <div><span>Dejar para AySA <small class="muted">${aysaPend?'(factura estimada)':'(ya está pagada)'}</small></span><span class="num">− ${fmt(aysaPend)}</span></div>
        <div><span>Apartar para el fondo <small class="muted">(${usd(usdMeta)})</small></span><span class="num">− ${fmt(fondoPesosMeta)}</span></div>
        ${pozoTj?`<div><span>Compras personales con la tarjeta <small class="muted">(vuelven al pozo)</small></span><span class="num">+ ${fmt(pozoTj)}</span></div>`:''}
        <div><span>Se puede repartir</span><span class="num">${fmt(libre+pozoTj)}</span></div>
      </div></section>
    <section><div class="sec-head"><h2>Anotar el reparto</h2><p>${descTot?'A quien tiene algo a descontar se le resta su parte.':'Mismo monto para '+hermanas.join(', ')+'.'}</p></div>
      <form class="card form" id="f-rep">
        <div class="row2 wide">
          <div class="field"><label for="rep-monto">A cada una</label><input id="rep-monto" class="monto" type="text" inputmode="decimal" placeholder="${sug?nro(sug):'0'}" autocomplete="off"></div>
          <div class="field"><label for="rep-de">De qué se reparte</label><select id="rep-de">${ORIGENES.map(([o])=>`<option ${o===origen?'selected':''}>${o}</option>`).join('')}</select></div>
        </div>
        <small class="muted" id="rep-hint"></small>
        ${descTot?`<div class="field"><span class="lbl">Le queda a cada una</span><div class="hist" id="rep-cada">${hermanas.map(h=>`<div data-h="${h}"><span>${h}</span><span class="${desc[h].length?'warn-t':''}">${desc[h].length?'− '+fmt(totalDesc(desc[h]))+' ('+desc[h].map(t=>esc(t.que)+(t.cuotas>1?' '+(cuotasHasta(t,m))+'/'+t.cuotas:'')).join(', ')+')':'sin descuentos'}</span><b class="num"></b></div>`).join('')}</div></div>`:''}
        <small class="muted">Hoy: ${hermanas.map(h=>h+' '+(valorTxt(rep[h].valores[i])||'—')).join(' · ')} · <button type="button" class="btn link" id="rep-sug">Usar sugerido</button></small>
        <div class="actions"><button class="btn primary" type="submit" data-modo="poner">Anotar</button><button class="btn" type="submit" data-modo="sumar">Sumar a lo anotado</button></div>
        ${hechos.length?`<div class="field"><span class="lbl">Repartos de ${MESES[i]}</span>${histo(hechos)}</div>`:''}
      </form></section>
  </div>
  <section><div class="sec-head"><h2>Fondo de ahorro</h2><p>La meta es dejar USD ${META_USD} por mes.</p></div>
    <form class="card form" id="f-fondo">
      <div class="row2 wide">
        <div class="field"><span class="lbl">Lo guardamos en</span><div class="seg" id="fondo-en"><button type="button" data-v="usd" aria-pressed="${fondoEn==='usd'}">Dólares</button><button type="button" data-v="ars" aria-pressed="${fondoEn==='ars'}">Pesos</button></div></div>
        <div class="field"><span class="lbl">Meta del mes</span><div class="chips" id="usd-chips">${[100,150,200].map(u=>`<button type="button" class="chip" aria-pressed="${u===usdMeta}" data-u="${u}">${usd(u)}</button>`).join('')}</div></div>
      </div>
      ${fondoEn==='usd'?`
      <div class="row2 wide">
        <div class="field"><label for="fondo-usd">Dólares que compran</label><input id="fondo-usd" class="monto" type="text" inputmode="decimal" placeholder="${usdMeta}" autocomplete="off"></div>
        <div class="field"><label for="tc">A cuánto el dólar ($)</label><input id="tc" class="monto" type="text" inputmode="decimal" value="${nro(tc)}"></div>
      </div>`:`
      <div class="field"><label for="fondo-ars">Pesos que apartan</label><input id="fondo-ars" class="monto" type="text" inputmode="decimal" placeholder="${nro(fondoPesosMeta)}" autocomplete="off"></div>`}
      <small class="muted" id="fondo-hint"></small>
      <div class="actions"><button type="submit" class="btn primary">Anotar fondo</button></div>
      ${fondoHechos.length?`<div class="field"><span class="lbl">Fondo de ${MESES[i]}</span>${histo(fondoHechos)}</div>`:''}
    </form></section>`;
  // reparto
  const hintRep=()=>{ const o=$('rep-de').value, c=cobradoDe(o); $('rep-hint').textContent = c!=null?`Cobrado de ${o} en ${MESES[i]}: ${fmt(c)} (un tercio: ${fmt(c/3)})`:''; };
  $('rep-de').onchange=()=>{ store.set('origen',$('rep-de').value); hintRep(); }; hintRep();
  $('rep-sug').onclick=()=>{ $('rep-monto').value=nro(sug); };
  let modo='poner';
  $('f-rep').querySelectorAll('button[type=submit]').forEach(b=>b.onclick=()=>{modo=b.dataset.modo;});
  const pintarCada=()=>{ if(!$('rep-cada')) return; const v=parseMonto($('rep-monto').value||$('rep-monto').placeholder)||0;
    $('rep-cada').querySelectorAll('div[data-h]').forEach(r=>{ r.querySelector('b').textContent=fmt(v-totalDesc(desc[r.dataset.h])); }); };
  $('rep-monto').addEventListener('input',pintarCada); pintarCada();
  $('f-rep').onsubmit=async e=>{ e.preventDefault(); if(ocupado) return;
    const v=parseMonto($('rep-monto').value); if(!v||v<0){ toast('Escribí un monto válido.',true); return; }
    const o=$('rep-de').value;
    // los descuentos de la tarjeta van una sola vez, en el primer reparto del mes
    const conDesc = !(modo==='sumar' && hermanas.some(h=>isNum(rep[h].valores[i])));
    const items=hermanas.map(h=>{ const f=rep[h], act=f.valores[i], dsc=conDesc?totalDesc(desc[h]):0, val=v-dsc;
      return {fila:f.fila,mes:m,concepto:f.concepto,detalle:`${fmt(v)} de ${o}${dsc?' − a descontar '+fmt(dsc):''}${modo==='sumar'&&isNum(act)?' (sumado)':''}`,valor: modo==='sumar'&&isNum(act) ? `=${act}+${val}` : val}; });
    const descontar = conDesc ? [].concat(desc.Mica,desc.Anto,desc.Cele).map(t=>({fila:t.fila,quien:t.quien,que:t.que,descontadas:Math.max(t.descontadas,cuotasHasta(t,m))})) : [];
    await anotar(items, `Reparto de ${fmt(v)} (${o}) anotado${descTot&&conDesc?', con los descuentos':' para las tres'}`, null, descontar.length?{tarjeta:{descontar}}:null);
  };
  // fondo
  const leer=()=>{ if(fondoEn==='usd'){ const u=parseMonto($('fondo-usd').value||$('fondo-usd').placeholder), t=parseMonto($('tc').value); return {u,t,p:u&&t?Math.round(u*t):null}; }
    const p=parseMonto($('fondo-ars').value||$('fondo-ars').placeholder); return {p}; };
  const hintF=()=>{ const x=leer(), act=M.fondo&&M.fondo.valores[i];
    $('fondo-hint').textContent = (fondoEn==='usd'&&x.p?`Son ${fmt(x.p)} en pesos. `:'')+(isNum(act)?`Se suma a lo ya apartado en ${MESES[i]} (${fmt(act)}).`:''); };
  $('f-fondo').addEventListener('input',e=>{ if(e.target.id==='tc'){ const t=parseMonto(e.target.value); if(t>0){ tc=t; store.set('tc',tc); } } hintF(); }); hintF();
  $('fondo-en').querySelectorAll('button').forEach(b=>b.onclick=()=>{ store.set('fondoEn',b.dataset.v); render(); });
  $('usd-chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ store.set('usdMeta',+c.dataset.u); render(); });
  $('f-fondo').onsubmit=async e=>{ e.preventDefault(); if(ocupado||!M.fondo) return;
    const x=leer(); if(!x.p||x.p<0||isNaN(x.p)){ toast('Escribí un monto válido.',true); return; }
    const act=M.fondo.valores[i];
    const detalle = fondoEn==='usd'?`${usd(x.u)} a ${fmt(x.t)}`:`${fmt(x.p)} en pesos`;
    await anotar([{fila:M.fondo.fila,mes:m,concepto:M.fondo.concepto,detalle,valor:isNum(act)?`=${act}+${x.p}`:x.p}],
      `Fondo: ${detalle} anotado`, fondoEn==='usd'?{mes:m,pesos:x.p,tc:x.t}:null);
  };
}

// ---------- Tablero ----------
function ajustesHTML(){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  return M.unidades.map(u=>{ const dias=Math.round((u.proximo-hoy)/864e5);
    const st=dias<0?3:(dias<=30?2:1); const txt=dias<0?'Vencido':(dias===0?'Hoy':`En ${dias} días`);
    return `<div class="aj"><span>${esc(u.unidad)} · ${esc(u.quien)}</span><span class="pill s${st}">${txt}</span><small>${isNum(u.alquiler)?fmt(u.alquiler)+' · ':''}${esc(u.indice)} · ${MESES[u.proximo.getMonth()]} ${u.proximo.getFullYear()}</small></div>`;}).join('') || '<div class="empty">Sin datos de unidades.</div>';
}
function vTablero(){
  const m=mesSel, i=m-1;
  const conDatos=M.cobrado.map((v,k)=>v>0?k:-1).filter(k=>k>=0);
  const ing=M.ingresos.map(f=>({k:f.concepto,v:isNum(f.valores[i])?f.valores[i]:0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const g={}; M.gastos.forEach(f=>{ if(isNum(f.valores[i])) g[f.grupo]=(g[f.grupo]||0)+f.valores[i]; });
  const gas=Object.entries(g).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const aysa=M.gastos.find(f=>f.grupo==='AySA');
  const aI=aysa?aysa.valores.map((v,k)=>isNum(v)?k:-1).filter(k=>k>=0):[];
  let filas='', dif=0;
  aI.forEach(k=>{ const toca=aysa.valores[k]*0.425, cob=M.cobLocal[k];
    if(cob==null){ filas+=`<tr><td>${MES_C[k]}</td><td>${fmt(toca)}</td><td>—</td><td><span class="pill s4">Sin desglose</span></td></tr>`; return; }
    const d=cob-toca; dif+=d; const ok=Math.abs(d)<5000;
    filas+=`<tr><td>${MES_C[k]}</td><td>${fmt(toca)}</td><td>${fmt(cob)}</td><td><span class="pill ${ok?'s1':(d>0?'s3':'s2')}">${ok?'Bien':(d>0?'+':'')+fmtK(d)}</span></td></tr>`; });
  const fondoV=M.fondo?M.fondo.valores:Array(12).fill(null);
  $('app').innerHTML = `
  <section><div class="sec-head"><h2>Mes a mes</h2><p>Barras: cobrado y pagado. Líneas: ganancia y total repartido entre las tres.</p></div>
    <div class="card"><div class="chart"><canvas id="c-evol" aria-label="Evolución mensual"></canvas></div></div></section>
  <div class="two">
    <section><div class="sec-head"><h2>De dónde viene la plata en ${MESES[i]}</h2></div><div class="card bars">${barras(ing)}</div></section>
    <section><div class="sec-head"><h2>En qué se va en ${MESES[i]}</h2></div><div class="card bars">${barras(gas,true)}</div></section>
  </div>
  <div class="two">
    <section><div class="sec-head"><h2>Próximos ajustes de alquiler</h2></div><div class="card">${ajustesHTML()}</div></section>
    <section><div class="sec-head"><h2>Fondo en dólares</h2><p>Dólar a ${fmt(tc)} (se cambia en Repartos).</p></div>
      <div class="card tbl"><table class="t"><thead><tr><th>Mes</th><th>Pesos</th><th>Dólares</th><th>Meta</th></tr></thead><tbody>
      ${conDatos.map(k=>{ const v=fondoV[k]; return `<tr><td>${cap(MESES[k])}</td><td>${isNum(v)?fmt(v):'—'}</td><td>${usdAhorrado(k)?usd(usdAhorrado(k)):'—'}</td><td><span class="pill s${estadoMes(k)}">${['','Cumplida','Corta','Sin ahorro','—'][estadoMes(k)]}</span></td></tr>`; }).join('')}
      </tbody></table></div></section>
  </div>
  <section><div class="sec-head"><h2>AySA del edificio</h2><p>Una sola factura para todo Sabattini. Al local le toca el 42,5%. De enero a marzo el local pagó AySA y ABL juntos.</p></div>
    <div class="two"><div class="card"><div class="chart sm"><canvas id="c-aysa" aria-label="Factura de AySA por mes"></canvas></div></div>
    <div class="card tbl"><table class="t"><thead><tr><th>Factura</th><th>Al local</th><th>Cobrado</th><th>Diferencia</th></tr></thead><tbody>${filas}</tbody><tfoot><tr><td><b>Neto</b></td><td></td><td></td><td><b>${dif>0?'+':''}${fmtK(dif)}</b></td></tr></tfoot></table></div></div>
    ${M.aysaMica?`<p class="muted" style="margin:0;font-size:.85rem">Mica deposita por el depto 5: ${fmt(M.aysaMica)} por mes (su 9,83% de AySA + ABL).</p>`:''}</section>`;
  dibujar(conDatos,aI,aysa);
}
function barras(items,alt){
  if(!items.length) return '<p class="muted" style="margin:0">Nada anotado este mes.</p>';
  const tot=sum(items.map(x=>x.v)), max=Math.max(...items.map(x=>x.v));
  return items.map(x=>`<div class="bar-row ${alt?'alt':''}"><span>${esc(x.k)}</span><span class="num">${fmtK(x.v)} <span class="pct">${Math.round(x.v/tot*100)}%</span></span><div class="track"><div class="fill" style="width:${(x.v/max*100).toFixed(1)}%"></div></div></div>`).join('');
}
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function dibujar(conDatos,aI,aysa){
  if(!window.Chart) return;
  const ink=css('--ink'),muted=css('--muted'),line=css('--line-2'),acc=css('--accent'),c2=css('--chart-2'),soft=css('--accent-soft'),bad=css('--bad');
  Chart.defaults.font.family=css('--f-body'); Chart.defaults.color=muted;
  const money={ticks:{callback:v=>fmtK(v)},grid:{color:line},border:{display:false}};
  const n=conDatos.map(k=>numeros(k+1));
  charts.push(new Chart($('c-evol'),{data:{labels:conDatos.map(k=>MES_C[k]),datasets:[
    {type:'bar',label:'Cobrado',data:n.map(x=>x.c),backgroundColor:'#A9D6C5',borderRadius:4,order:3},
    {type:'bar',label:'Pagado',data:n.map(x=>x.p),backgroundColor:c2,borderRadius:4,order:3},
    {type:'line',label:'Ganancia',data:n.map(x=>x.g),borderColor:acc,backgroundColor:acc,pointRadius:3,borderWidth:2.5,tension:.25,order:1},
    {type:'line',label:'Repartido',data:n.map(x=>x.totalRep||null),borderColor:bad,backgroundColor:bad,borderDash:[5,4],pointRadius:2,borderWidth:2,tension:.25,order:2}
  ]},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{y:{...money,beginAtZero:true},x:{grid:{display:false}}},
    plugins:{legend:{labels:{color:ink,usePointStyle:true,boxWidth:8}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`}}}}}));
  if(aysa&&aI.length) charts.push(new Chart($('c-aysa'),{type:'line',data:{labels:aI.map(k=>MES_C[k]),datasets:[{label:'Factura',data:aI.map(k=>aysa.valores[k]),borderColor:acc,backgroundColor:soft,fill:true,pointRadius:3,borderWidth:2.5,tension:.25}]},
    options:{maintainAspectRatio:false,scales:{y:money,x:{grid:{display:false}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.parsed.y)}}}}}));
}

// ---------- entrar con Google ----------
function pintarEntrar(error){
  $('shell').hidden=true; $('login').hidden=false;
  $('login').innerHTML=`<div class="login"><div class="card">
    <div><div class="brand">PETRO</div><div class="muted">Alquileres · Cele, Mica y Anto</div></div>
    ${error?`<p class="pill s3" style="white-space:normal;margin:0;padding:8px 12px;border-radius:10px">${esc(error)}</p>`:''}
    <p class="muted" style="margin:0">Entrá con tu cuenta de Google. Solo funciona para las cuentas que tienen el Sheet de PETRO compartido. Google pide confirmar una vez por hora.</p>
    <button class="btn primary" id="entrar">Entrar con Google</button>
  </div></div>`;
  if(!CFG.googleClientId){ $('entrar').disabled=true; return; }
  $('entrar').onclick=async()=>{ try{ await pedirToken(store.get('email','')?'':'select_account'); cargar(); }catch(e){ pintarEntrar(e.message); } };
}
function avisoVencido(){
  if($('vencido')) return;
  const b=document.createElement('div'); b.id='vencido'; b.className='vencido';
  b.innerHTML='La conexión con Google dura una hora. <button class="btn">Seguir conectada</button>';
  b.querySelector('button').onclick=async()=>{ try{ await pedirToken(''); b.remove(); cargar(); }catch(e){ toast(e.message,true); } };
  document.body.appendChild(b);
}
let tTimer;
function toast(msg,err){ clearTimeout(tTimer); let t=document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.setAttribute('role','status'); document.body.appendChild(t);} t.className='toast'+(err?' err':''); t.textContent=msg; tTimer=setTimeout(()=>t.remove(),err?6000:2600); }

$('mes').onchange=e=>{ mesSel=+e.target.value; store.set('mes',mesSel); cg.mes=null; render(); };
$('recargar').onclick=()=>{ if(!ocupado) cargar(); };
$('menu').onclick=()=>$('shell').classList.toggle('open');
$('shell').addEventListener('click',e=>{ if(e.target===$('shell')) $('shell').classList.remove('open'); });
window.addEventListener('hashchange',render);
if(tokenOk()){ $('shell').hidden=false; $('app').innerHTML='<p class="muted">Cargando el Sheet…</p>'; cargar(); } else pintarEntrar();
})();
</script>
</body>
</html>
